# Gradle daemon memory. Decompiling and recompiling Minecraft needs more than the 1G default.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment parameter names on top of official Mojang mappings.
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.8
parchment_mappings_version=2025.09.14

# Environment
# NeoForge versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.8
minecraft_version_range=[1.21.8]
neo_version=21.8.57

# Mod properties
mod_id=vastlands
mod_name=Vastlands
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.sincerelyuq.vastlands
mod_authors=sincerelyuq
