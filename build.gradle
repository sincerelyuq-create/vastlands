plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.21.8 ships Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Extra game arguments, e.g. -PclientArgs="--quickPlaySingleplayer world" (tools/worldcheck/screenshot.py).
            if (project.hasProperty('clientArgs')) {
                programArguments.addAll(project.property('clientArgs').toString().split(' ').toList())
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // JUnit tests run inside a loaded game environment (registries bootstrapped, mixins applied).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Dependencies needed only at dev runtime, never published as dependencies of the mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    // EphemeralTestServerProvider: a datapack-loaded server for JUnit tests.
    testImplementation "net.neoforged:testframework:${neo_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Gradle gives test workers 512 MB by default; the tests run inside a loaded game and the
    // terrain, hydrology and cave models keep per-thread caches.
    maxHeapSize = '2G'
}

// Expands ${} properties from gradle.properties into src/main/templates (mod metadata).
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Renders the Vastlands terrain of a seed without starting the game and exports expected surface
// heights for tools/worldcheck. Arguments: see com.sincerelyuq.vastlands.tools.TerrainPreview.
tasks.register('terrainPreview', JavaExec) {
    group = 'vastlands'
    description = 'Renders Vastlands terrain previews (PNG) and exports expected surface heights'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sincerelyuq.vastlands.tools.TerrainPreview'
    workingDir = layout.projectDirectory.asFile
    jvmArgs '-Djava.awt.headless=true'
}

// Renders the rivers and lakes of a seed over the carved terrain. Arguments: see
// com.sincerelyuq.vastlands.tools.HydrologyPreview.
tasks.register('hydrologyPreview', JavaExec) {
    group = 'vastlands'
    description = 'Renders Vastlands river and lake previews (PNG)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sincerelyuq.vastlands.tools.HydrologyPreview'
    workingDir = layout.projectDirectory.asFile
    jvmArgs '-Djava.awt.headless=true', '-Xmx4G'
}

// Renders sections and slices of the Vastlands caves, prints cave statistics, checks the cave
// fluids against vanilla's flow rules and times the cave stage. Arguments: see
// com.sincerelyuq.vastlands.tools.CavePreview.
tasks.register('cavePreview', JavaExec) {
    group = 'vastlands'
    description = 'Renders Vastlands cave sections (PNG), statistics and fluid checks'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sincerelyuq.vastlands.tools.CavePreview'
    workingDir = layout.projectDirectory.asFile
    jvmArgs '-Djava.awt.headless=true', '-Xmx4G'
    // Extra JVM arguments, e.g. -PpreviewJvmArgs="-XX:StartFlightRecording=filename=build/caves/bench.jfr" for profiling.
    if (project.hasProperty('previewJvmArgs')) {
        jvmArgs project.property('previewJvmArgs').toString().split(' ').toList()
    }
}

// Measures the caves of a square: cave share by height and depth, passage widths (local thickness),
// cave heights, wide spaces and megacaves, connectivity, water bodies, entrances and cave biomes.
// Arguments: see com.sincerelyuq.vastlands.tools.CaveSurvey.
tasks.register('caveSurvey', JavaExec) {
    group = 'vastlands'
    description = 'Prints quantitative statistics of the Vastlands caves of a square'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sincerelyuq.vastlands.tools.CaveSurvey'
    workingDir = layout.projectDirectory.asFile
    jvmArgs '-Djava.awt.headless=true', '-Xmx8G'
}
tasks.named('caveSurvey', JavaExec).configure {
    if (project.hasProperty('previewJvmArgs')) {
        jvmArgs project.property('previewJvmArgs').toString().split(' ').toList()
    }
}

// Renders Vastlands forests without the game: tree forms, isometric views and aerial maps of a
// square, forest statistics and the model's cost per chunk. Arguments: see
// com.sincerelyuq.vastlands.tools.ForestPreview.
tasks.register('forestPreview', JavaExec) {
    group = 'vastlands'
    description = 'Renders Vastlands forest previews (PNG) and forest statistics'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sincerelyuq.vastlands.tools.ForestPreview'
    workingDir = layout.projectDirectory.asFile
    jvmArgs '-Djava.awt.headless=true', '-Xmx6G'
}

// Renders the natural formations (boulders, tors, spires, arches, driftwood, cave formations)
// without the game: a gallery of every kind, views of the surface and of the caves, statistics,
// the cost per chunk and an order check. Arguments: see com.sincerelyuq.vastlands.tools.NaturePreview.
tasks.register('naturePreview', JavaExec) {
    group = 'vastlands'
    description = 'Renders Vastlands natural formations (PNG) and their statistics'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sincerelyuq.vastlands.tools.NaturePreview'
    workingDir = layout.projectDirectory.asFile
    jvmArgs '-Djava.awt.headless=true', '-Xmx6G'
}
