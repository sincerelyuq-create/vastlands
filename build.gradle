plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.21.8 ships Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Extra game arguments, e.g. -PclientArgs="--quickPlaySingleplayer world" (tools/worldcheck/screenshot.py).
            if (project.hasProperty('clientArgs')) {
                programArguments.addAll(project.property('clientArgs').toString().split(' ').toList())
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // JUnit tests run inside a loaded game environment (registries bootstrapped, mixins applied).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Dependencies needed only at dev runtime, never published as dependencies of the mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    // EphemeralTestServerProvider: a datapack-loaded server for JUnit tests.
    testImplementation "net.neoforged:testframework:${neo_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Expands ${} properties from gradle.properties into src/main/templates (mod metadata).
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Renders the Vastlands terrain of a seed without starting the game and exports expected surface
// heights for tools/worldcheck. Arguments: see com.sincerelyuq.vastlands.tools.TerrainPreview.
tasks.register('terrainPreview', JavaExec) {
    group = 'vastlands'
    description = 'Renders Vastlands terrain previews (PNG) and exports expected surface heights'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sincerelyuq.vastlands.tools.TerrainPreview'
    workingDir = layout.projectDirectory.asFile
    jvmArgs '-Djava.awt.headless=true'
}
